  <style>
    :root {
      --bg: #f0f4f8;
      --ink: #1a1d23;
      --accent: #1e3a5f;
      --accent-light: #2d5a8e;
      --accent-glow: rgba(30, 58, 95, 0.08);
      --paper: #ffffff;
      --muted: #64748b;
      --line: #e2e8f0;
      --up: #dc2626;
      --down: #2563eb;
      --gold: #d97706;
      --silver: #64748b;
      --bronze: #a16207;
      --font-body: "Pretendard", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 40px rgba(0,0,0,0.08);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-body); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
    .hero { background: linear-gradient(135deg, #1e3a5f 0%, #2d5a8e 50%, #3b7dbd 100%); color: #fff; padding: 40px 20px 28px; text-align: center; position: relative; overflow: hidden; }
    .hero::before { content: ''; position: absolute; top: -50%; left: -30%; width: 160%; height: 200%; background: radial-gradient(ellipse, rgba(255,255,255,0.06) 0%, transparent 70%); pointer-events: none; }
    .hero h1 { margin: 0 0 8px; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; position: relative; }
    .hero p { margin: 0; font-size: 14px; opacity: 0.75; position: relative; }
    .nav-bar { max-width: 1200px; margin: 0 auto; padding: 16px 20px 12px; display: flex; gap: 8px; align-items: center; }
    .nav-link { flex-shrink: 0; padding: 8px 20px; border: none; border-radius: 24px; background: var(--paper); color: var(--muted); font-family: var(--font-body); font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; transition: all 0.2s ease; box-shadow: var(--shadow-sm); }
    .nav-link:hover { color: var(--accent); box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .nav-link.active { background: var(--accent); color: #fff; cursor: default; box-shadow: 0 2px 8px rgba(30,58,95,0.25); }
    .tabs { display: flex; gap: 0; padding: 0 20px; max-width: 1200px; margin: 0 auto; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; border-bottom: 2px solid var(--line); }
    .tabs::-webkit-scrollbar { display: none; }
    .region-label { flex-shrink: 0; padding: 10px 14px 12px 0; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.5px; white-space: nowrap; }
    .tab-btn { flex-shrink: 0; padding: 10px 16px 12px; border: none; border-bottom: 2px solid transparent; margin-bottom: -2px; background: transparent; color: var(--muted); font-family: var(--font-body); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s ease; white-space: nowrap; }
    .tab-btn:hover { color: var(--accent); }
    .tab-btn.active { color: var(--accent); font-weight: 700; border-bottom-color: var(--accent); }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 20px 40px; }
    .section { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow-md); transition: box-shadow 0.2s; }
    .section:hover { box-shadow: var(--shadow-lg); }
    .section-title { font-size: 20px; font-weight: 800; margin: 0 0 4px; }
    .section-sub { font-size: 13px; color: var(--muted); margin: 0 0 20px; }
    .rank-card { display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); cursor: pointer; transition: background 0.15s; }
    .rank-card:last-child { border-bottom: none; }
    .rank-card:hover { background: var(--accent-glow); margin: 0 -12px; padding: 16px 12px; border-radius: 12px; }
    .rank-num { font-size: 22px; font-weight: 800; line-height: 1.2; color: var(--muted); }
    .rank-num.n1 { color: var(--gold); }
    .rank-num.n2 { color: var(--silver); }
    .rank-num.n3 { color: var(--bronze); }
    .rank-top { display: flex; justify-content: space-between; gap: 12px; }
    .rank-apt { font-weight: 700; font-size: 15px; }
    .rank-detail { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
    .rank-change { text-align: right; white-space: nowrap; }
    .rank-pct { font-size: 14px; font-weight: 800; color: var(--ink); margin-bottom: 4px; }
    .rank-pct .pct-value { color: var(--down); font-weight: 800; }
    .rank-diff { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
    .rank-diff .pct-value { color: var(--down); font-weight: 700; }
    .compare-panel { grid-column: 2 / -1; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; box-shadow: var(--shadow-sm); }
    .compare-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .compare-title { font-size: 12px; color: var(--muted); margin: 0; font-weight: 600; }
    .compare-close { border: 1px solid var(--line); background: var(--paper); color: var(--muted); font-size: 11px; border-radius: 10px; padding: 2px 8px; cursor: pointer; }
    .compare-chart { width: 100%; height: 220px; display: block; }
    .compare-legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 6px 10px; margin-top: 8px; font-size: 12px; color: var(--muted); }
    .legend-item { display: flex; gap: 6px; align-items: center; }
    .legend-color { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .detail-btn { background: var(--paper); border: 1px solid var(--line); color: var(--muted); font-family: var(--font-body); font-size: 11px; font-weight: 600; border-radius: 999px; padding: 5px 12px; cursor: pointer; white-space: nowrap; transition: all 0.15s ease; }
    .detail-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
    .no-data { font-size: 13px; color: var(--muted); padding: 12px 0; }
    button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .site-footer { text-align: center; padding: 32px 20px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
    .site-footer a { color: var(--muted); text-decoration: none; }
    .site-footer a:hover { color: var(--accent); }
    @media (max-width: 720px) {
      .hero { padding: 32px 16px 24px; }

      .tab-btn { padding: 8px 12px 10px; font-size: 13px; }
      .section { padding: 18px 16px; border-radius: 14px; }
      .rank-apt { font-size: 13px; line-height: 1.4; white-space: normal; overflow: visible; text-overflow: clip; word-break: keep-all; overflow-wrap: anywhere; }
