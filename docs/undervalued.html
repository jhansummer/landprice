<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>저평가 TOP3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Eczar:wght@600;700&family=Inter:wght@400;500;600;700&family=Nanum+Gothic:wght@400;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper: #fbf8f2;
      --ink: #1d1b18;
      --muted: #6e6a63;
      --line: #d8cfc1;
      --accent: #8c3b1f;
      --bg: #f4efe8;
      --up: #1f6f52;
      --down: #c0392b;
      --font-title: "Playfair Display", serif;
      --font-body: "Nanum Gothic", "Inter", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--bg);
    }
    header {
      text-align: center;
      padding: 32px 20px 12px;
    }
    h1 {
      font-family: var(--font-title);
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--accent);
      margin: 0 0 8px;
    }
    .sub {
      color: var(--muted);
      font-size: 12px;
      margin: 0;
    }
    .filter-bar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .search-link-btn {
      flex-shrink: 0;
      padding: 8px 18px;
      border: 1px solid var(--accent);
      border-radius: 20px;
      background: var(--paper);
      color: var(--accent);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .search-link-btn:hover {
      background: var(--accent);
      color: #fff;
    }
    .search-link-btn.active {
      background: var(--accent);
      color: #fff;
      cursor: default;
    }
    .tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 0 20px 12px;
    }
    .tab-btn {
      border: 1px solid var(--line);
      background: var(--paper);
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
    }
    .tab-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }
    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 16px 40px;
    }
    .section {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 16px;
      box-shadow: 0 6px 20px rgba(28, 27, 25, 0.06);
    }
    .section-title {
      font-family: var(--font-title);
      font-size: 18px;
      margin: 0 0 4px;
    }
    .section-sub {
      color: var(--muted);
      font-size: 12px;
      margin: 0 0 10px;
    }
    .rank-card {
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 10px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .rank-card:last-child { border-bottom: none; }
    .rank-num {
      font-family: var(--font-title);
      font-size: 18px;
      font-weight: 700;
    }
    .rank-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .rank-apt { font-weight: 700; font-size: 14px; }
    .rank-detail { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.8; }
    .rank-change { text-align: right; white-space: nowrap; }
    .rank-pct { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
    .rank-diff { font-size: 11px; color: var(--muted); }
    .compare-panel {
      grid-column: 2 / -1;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 12px 10px;
      margin-top: 10px;
    }
    .compare-title {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 8px;
    }
    .compare-chart {
      width: 100%;
      height: 220px;
      display: block;
    }
    .compare-legend {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 6px 10px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .legend-item {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .legend-color {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .no-data { font-size: 12px; color: var(--muted); padding: 6px 0; }
  </style>
</head>
<body>
  <header>
    <h1>아파트 실거래가 APT Mine</h1>
    <p class="sub">출처 : 국토교통부 실거래가</p>
  </header>
  <nav id="tabs" class="tabs"></nav>
  <div class="filter-bar">
    <a class="search-link-btn" href="index.html">메인</a>
    <a class="search-link-btn" href="search.html">단지명 검색</a>
    <span class="search-link-btn active">저평가 TOP3</span>
  </div>
  <div class="wrap">
    <div id="content"></div>
  </div>
  <script src="undervalued.js?v=1"></script>
</body>
</html>
