name: Refresh Apt Trade Data

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-apt-trade
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Fetch data
        timeout-minutes: 110
        continue-on-error: true
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          MONTHS_KEPT: "84"
          REFRESH_MONTHS: "6"
          RENT_REFRESH_MONTHS: "6"
          RENT_BACKFILL_BATCH: "6"
          FETCH_WORKERS: "4"
        run: |
          python scripts/fetch_apt_trade.py
      - name: Build today trades
        continue-on-error: true
        run: python scripts/build_today_trades.py
      - name: Enrich bottom with geo data
        continue-on-error: true
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          python scripts/enrich_bottom_geo.py
      - name: Build apt metadata
        continue-on-error: true
        run: |
          python scripts/build_apt_meta.py
      - name: Find undervalued apartments
        continue-on-error: true
        run: |
          python scripts/find_undervalued.py
      - name: Fetch household data
        continue-on-error: true
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
        run: |
          python scripts/fetch_household.py
      - name: Enrich valuation with geo data
        continue-on-error: true
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          ODSAY_API_KEY: ${{ secrets.ODSAY_API_KEY }}
        run: |
          python scripts/enrich_valuation_geo.py
      - name: Build coords for map view
        continue-on-error: true
        run: |
          python scripts/build_coords.py
      - name: Build location value ranking
        continue-on-error: true
        run: |
          python scripts/build_location_value.py
      - name: Build newhigh summary
        continue-on-error: true
        run: |
          python scripts/build_newhigh.py
      - name: Build backtest results
        timeout-minutes: 90
        continue-on-error: true
        run: |
          python scripts/build_backtest_historical.py --lookback 24
      - name: Build apt lookup index
        continue-on-error: true
        run: |
          python scripts/build_apt_lookup.py
      - name: Enrich per-apt files
        continue-on-error: true
        run: |
          python scripts/build_apt_enriched.py
      - name: Generate apt SEO pages
        continue-on-error: true
        run: python scripts/generate_apt_pages.py
      - name: Update sitemap lastmod
        run: python scripts/update_sitemap.py
      - name: Update Notion weekly threads
        continue-on-error: true
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: python scripts/update_notion_weekly.py
      - name: Daily recommendation
        continue-on-error: true
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: python scripts/daily_recommendation.py
      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add docs/data/apt_trade docs/apt docs/sitemap.xml docs/sitemap-pages.xml docs/sitemap-apt-*.xml
            for f in scripts/geocode_cache.json scripts/enrichment_cache.json scripts/schools.json scripts/household_cache.json scripts/backtest_cache.json scripts/backtest_hist_cache.json scripts/today_trades_cache.json; do
              [ -f "$f" ] && git add "$f"
            done
            git diff --cached --quiet && echo "Nothing staged" && exit 0
            git commit -m "chore: refresh apt trade data"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit"
          fi
